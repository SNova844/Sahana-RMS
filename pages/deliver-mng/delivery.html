<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery Management - Sahana RMS</title>
  <link rel="stylesheet" href="delivery.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="logo-section">
          <div class="logo-box">S</div>
          <div>
            <h2>Sahana Urban</h2>
            <p>Admin Panel</p>
          </div>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search here..." />
        </div>
      </div>

      <nav class="sidebar-menu">
        <a href="../../dashboard.html" class="menu-item">
          <i class="fa-solid fa-table-columns"></i>
          <span>Dashboard</span>
        </a>

        <a href="../user-mng/user.html" class="menu-item">
          <i class="fa-solid fa-users"></i>
          <span>User Management</span>
        </a>

        <a href="../order-mng/order.html" class="menu-item">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>Order Management</span>
        </a>

        <a href="delivery.html" class="menu-item active">
          <i class="fa-solid fa-truck"></i>
          <span>Delivery Management</span>
        </a>

        <a href="../supplier-mng/supplier.html" class="menu-item">
          <i class="fa-solid fa-handshake"></i>
          <span>Supplier Management</span>
        </a>

        <a href="../stock-mng/stock.html" class="menu-item">
          <i class="fa-solid fa-boxes-stacked"></i>
          <span>Stock Management</span>
        </a>

        <a href="../employee-mng/list.html" class="menu-item">
          <i class="fa-solid fa-id-badge"></i>
          <span>Employee Management</span>
        </a>

        <a href="#" class="menu-item">
          <i class="fa-solid fa-gear"></i>
          <span>Settings</span>
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main-content">
      <!-- Header with Logo, Breadcrumb, and Back Button -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
          </button>
          <!-- <h1>Supplier Management</h1> -->
        </div>

        <!-- <div class="topbar-center">
          <a href="../../index.html">Home</a>
          <a href="#">About</a>
          <a href="#">Services</a>
          <a href="#">Contact</a>
        </div> -->

        <div class="topbar-right">
          <a href="../../login.html" class="top-btn">Login</a>
          <a href="../../signup.html" class="top-btn top-btn-primary">Sign Up</a>
        </div>
      </header>

      <!-- Content Area with Data Table -->
      <section class="content-area">
        <div class="table-header">
          <h2>Delivery List</h2>
          <a href="add-delivery.html" class="add-new-btn">
            <i class="fa-solid fa-plus"></i>
            Add New Delivery
          </a>
        </div>

        <div class="table-container">
          <table class="delivery-table">
            <thead>
              <tr>
                <th style="width: 60px;">#</th>
                <th style="width: 100px;">Order ID</th>
                <th style="width: 150px;">Customer Name</th>
                <th style="width: 150px;">Rider</th>
                <th style="width: 140px;">Address</th>
                <th style="width: 130px;">Phone</th>
                <th style="width: 110px;">Status</th>
                <th style="width: 150px;">Action</th>
              </tr>
            </thead>
            <tbody id="deliveryTableBody">
              <!-- Rows will be populated by JavaScript -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="delivery.js"></script>
</body>
</html>
