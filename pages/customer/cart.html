<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shopping Cart | Sahana Urban</title>

  <link rel="stylesheet" href="customer.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<header class="main-header">
  <nav class="navbar">
    <a href="../../index.html" class="brand">
      <img src="../../images/logo.png" alt="Logo">
    </a>

    <div class="nav-links">
      <a href="../../index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="cart.html">Cart</a>
      <a href="checkout.html">Checkout</a>
    </div>

    <a href="checkout.html" class="book-btn">Checkout</a>
  </nav>
</header>

<section class="cart-page">

  <div class="cart-header">
    <h1>Shopping Cart</h1>
    <p>Review your selected items</p>
  </div>

  <div class="cart-layout">

    <!-- LEFT -->
    <div class="cart-left">

      <div class="cart-table-header">
        <span>Product</span>
        <span>Price</span>
        <span>Quantity</span>
        <span>Sub Total</span>
      </div>

      <div id="cartItemsContainer">
        <!-- Items load here -->
      </div>

    </div>

    <!-- RIGHT -->
    <div class="cart-right">

      <h2>Order Summary</h2>

      <div class="summary-row">
        <span>Items</span>
        <span id="itemCount">0</span>
      </div>

      <div class="summary-row">
        <span>Sub Total</span>
        <span id="cartSubtotal">Rs. 0</span>
      </div>

      <div class="summary-row">
        <span id="chargeLabel">Service Charge</span>
        <span id="extraCharge">Rs. 0</span>
      </div>

      <div class="summary-total">
        <span>Total</span>
        <span id="cartTotal">Rs. 0</span>
      </div>

      <a href="checkout.html" class="checkout-btn">
        Proceed to Checkout
      </a>

    </div>

  </div>

</section>

<footer class="footer">
  <p>© 2026 Sahana Urban. All rights reserved.</p>
</footer>

<script src="cart.js"></script>
</body>
</html>
