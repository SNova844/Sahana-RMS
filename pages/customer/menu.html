<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Menu | Sahana Urban</title>

  <link rel="stylesheet" href="customer.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<header class="main-header">
  <nav class="navbar">
    <a href="../../index.html" class="brand">
      <img src="../../images/logo.png" alt="Logo">
    </a>

    <div class="nav-links">
      <a href="../../index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="cart.html">Cart</a>
      <a href="checkout.html">Checkout</a>
    </div>

    <a href="cart.html" class="book-btn">View Cart</a>
  </nav>
</header>

<!-- MENU HERO -->
<section class="menu-hero-banner">
  <div class="menu-banner-overlay"></div>

  <div class="menu-banner-content">
    <h1>Our Menu</h1>
    <p>Choose your favourite meal and place your order</p>
  </div>
</section>

<!-- CATEGORY FILTERS -->
<section class="menu-filter-section">
  <div class="category-filters">

    <button onclick="filterMenu('All')">All</button>
    <button onclick="filterMenu('Burgers')">Burgers</button>
    <button onclick="filterMenu('Chicken')">Chicken</button>
    <button onclick="filterMenu('Rice')">Rice</button>
    <button onclick="filterMenu('Pizza')">Pizza</button>
    <button onclick="filterMenu('Drinks')">Drinks</button>
    <button onclick="filterMenu('Desserts')">Desserts</button>

  </div>
</section>

<!-- MENU ITEMS -->
<section class="customer-menu-section">
  <div class="customer-menu-grid" id="menuItemsContainer">
    <!-- Firebase food items load here -->
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <p>© 2026 Sahana Urban. All rights reserved.</p>
</footer>

<script type="module" src="customer.js"></script>
</body>
</html>
