<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment | Sahana Urban</title>

  <link rel="stylesheet" href="customer.css">
</head>
<body>

<header class="main-header">
  <nav class="navbar">
    <a href="../../index.html" class="brand">
      <img src="../../images/logo.png" alt="Logo">
    </a>

    <div class="nav-links">
      <a href="menu.html">Menu</a>
      <a href="cart.html">Cart</a>
      <a href="checkout.html">Checkout</a>
    </div>
  </nav>
</header>

<section class="payment-page">
  <div class="payment-card">
    <h1>Secure Payment</h1>
    <p>Enter payment details to complete your order</p>

    <div class="payment-summary">
      <span>Total Amount</span>
      <strong id="paymentTotal">Rs. 0</strong>
    </div>

    <form id="paymentForm">
      <label>Cardholder Name</label>
      <input type="text" id="cardName" required>

      <label>Card Number</label>
      <input type="text" id="cardNumber" maxlength="16" required>

      <div class="payment-row">
        <div>
          <label>Expiry Date</label>
          <input type="text" id="expiryDate" placeholder="MM/YY" required>
        </div>

        <div>
          <label>CVV</label>
          <input type="password" id="cvv" maxlength="3" required>
        </div>
      </div>

      <button type="submit">Pay Now</button>
    </form>
  </div>
</section>

<script type="module" src="payment.js"></script>
</body>
</html>
